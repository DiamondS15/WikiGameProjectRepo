<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiGame - Single Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">← WikiGame</a>
            <span class="navbar-text">Single Player</span>
        </div>
    </nav>

    <div class="container-fluid game-container">
        <div class="row g-0">
            <!-- Left sidebar - Game info (narrow) -->
            <div class="col-2 sidebar">
                <div class="game-info">
                    <div class="info-section">
                        <h6>Goal</h6>
                        <div id="goal-title" class="goal-article">Loading...</div>
                    </div>

                    <div class="info-section">
                        <h6>Stats</h6>
                        <div class="stat-item">
                            <span>Score</span>
                            <span id="score" class="stat-value">1000</span>
                        </div>
                        <div class="stat-item">
                            <span>Time</span>
                            <span id="timer" class="stat-value">00:00</span>
                        </div>
                        <div class="stat-item">
                            <span>Moves</span>
                            <span id="moves" class="stat-value">0</span>
                        </div>
                    </div>

                    <div class="info-section">
                        <h6>Controls</h6>
                        <button id="new-game" class="btn btn-sm btn-outline-primary w-100 mb-2">New Game</button>
                        <button id="hint" class="btn btn-sm btn-outline-warning w-100 mb-2">Hint (-50)</button>
                        <button id="give-up" class="btn btn-sm btn-outline-danger w-100">Give Up</button>
                    </div>

                    <div class="info-section">
                        <h6>Links</h6>
                        <div id="article-count" class="small">0 available</div>
                    </div>
                </div>
            </div>

            <!-- Main content - Wikipedia article (wide) -->
            <div class="col-10 main-content">
                <div class="article-header">
                    <h5 id="current-title">Current: <span class="text-muted">Loading...</span></h5>
                </div>
                <div id="article-content" class="article-content">
                    <div class="text-center mt-5">
                        <div class="spinner-border text-secondary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Loading article...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>

</html>
