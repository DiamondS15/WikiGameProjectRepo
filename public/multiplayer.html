<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiGame - Multiplayer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">← WikiGame</a>
            <span class="navbar-text">Multiplayer</span>
        </div>
    </nav>

    <div class="container-fluid game-container">
        <div class="row g-0">
            <div class="col-2 sidebar">
                <div class="game-info">
                    <!-- Same core game sections as single player -->
                    <div class="info-section">
                        <h6>Goal</h6>
                        <div id="goal-title" class="goal-article">-</div>
                    </div>

                    <div class="info-section">
                        <h6>Stats</h6>
                        <div class="stat-item">
                            <span>Wikiscore</span>
                            <span id="score" class="stat-value">1000</span>
                        </div>
                        <div class="stat-item">
                            <span>Time</span>
                            <span id="timer" class="stat-value">00:00</span>
                        </div>
                        <div class="stat-item">
                            <span>Moves</span>
                            <span id="moves" class="stat-value">0</span>
                        </div>
                    </div>

                    <div class="info-section">
                        <h6>Controls</h6>
                        <button id="new-game" class="btn btn-sm btn-outline-primary w-100 mb-2">New Game</button>
                        <button id="give-up" class="btn btn-sm btn-outline-danger w-100">Give Up</button>
                    </div>

                    <div class="info-section">
                        <h6>Links</h6>
                        <div id="article-count" class="small">0 available</div>
                    </div>

                    <!-- Multiplayer-only additions -->
                    <div id="roomSetupSection">
                        <div class="info-section">
                            <h6>Player</h6>
                            <input type="text" id="playerName" class="form-control form-control-sm mb-2" placeholder="Enter name" maxlength="20">
                        </div>

                        <div class="info-section">
                            <h6>Room</h6>
                            <button id="createRoomBtn" class="btn btn-sm btn-outline-primary w-100 mb-2">Create Room</button>
                            <input type="text" id="roomCodeInput" class="form-control form-control-sm mb-2" placeholder="Room code" maxlength="6">
                            <button id="joinRoomBtn" class="btn btn-sm btn-outline-primary w-100">Join Room</button>
                        </div>
                    </div>

                    <div class="info-section">
                        <h6>Lobby</h6>
                        <div class="stat-item">
                            <span>Code</span>
                            <span id="roomCodeDisplay" class="stat-value">-</span>
                        </div>
                        <div class="stat-item">
                            <span>Status</span>
                            <span id="roomStatus" class="stat-value">-</span>
                        </div>
                        <button id="startGameBtn" class="btn btn-sm btn-outline-warning w-100 mt-2" style="display:none;">Start Game</button>
                    </div>

                    <div class="info-section">
                        <h6>Players</h6>
                        <div id="playerList" class="small text-muted">No players yet</div>
                    </div>

                    <div class="info-section">
                        <h6>Message</h6>
                        <div id="setupMessage" class="small text-muted">Create or join a room.</div>
                    </div>
                </div>
            </div>

            <div class="col-10 main-content">
                <div class="article-header">
                    <h5 id="current-title">Current: <span class="text-muted">Not started</span></h5>
                </div>

                <div id="article-content" class="article-content">
                    <div class="text-center mt-5">
                        <p class="mt-2 text-muted">Create a room or join a room to begin multiplayer.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/multiplayer.js"></script>
</body>

</html>
